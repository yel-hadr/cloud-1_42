---
# Non-secret, per-group settings. Secrets live next door in vault.yml,
# encrypted; nothing in this file is confidential.

# The public name of the site. phpMyAdmin answers on pma.<name>, so both
# this name and pma.<name> need A records pointing at the instance.
# Set back to "{{ ansible_host }}" to fall back to the bare IP.
wordpress_domain: youssefelhadraoui.tech
wordpress_site_url: "https://{{ wordpress_domain }}"

# A real certificate, since the domain resolves here. Requires port 80
# reachable from the internet for the ACME HTTP-01 challenge.
wordpress_tls_letsencrypt: true
wordpress_tls_le_email: "ssefy1998@gmail.com"

wordpress_site_title: Cloud-1
wordpress_admin_user: cloud1admin
wordpress_admin_email: "ssefy1998@gmail.com"

wordpress_db_name: wordpress
wordpress_db_user: wpuser

# Convenience only: lets the admin user run docker without sudo. Docker
# group membership is root-equivalent, so nothing else goes in here.
docker_users:
  - "{{ common_admin_user }}"

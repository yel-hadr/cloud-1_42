---
# Fail before anything is written if the vault was not loaded, rather
# than rendering an .env full of "None" and debugging it in a container.
- name: Assert that the vault secrets are available
  ansible.builtin.assert:
    that:
      - vault_wp_db_password | default('') | length > 0
      - vault_wp_db_root_password | default('') | length > 0
      - vault_wp_admin_password | default('') | length > 0
    fail_msg: >-
      Vault secrets are missing. Check group_vars/webservers/vault.yml and
      that ansible.cfg's vault_password_file points at a readable file.
    quiet: true

- name: Create the stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ wordpress_stack_dir }}"
    - "{{ wordpress_stack_dir }}/nginx/conf.d"
    - "{{ wordpress_tls_le_dir }}"

- name: Create the certificate directory
  ansible.builtin.file:
    path: "{{ wordpress_stack_dir }}/certs"
    state: directory
    owner: root
    group: root
    mode: '0700'

# Decides which certificate the nginx template points at. On the very
# first run this is false and nginx boots on the self-signed pair; the
# letsencrypt tasks below flip it and re-render once a real cert exists.
- name: Check whether a Let's Encrypt certificate is already present
  ansible.builtin.stat:
    path: "{{ wordpress_tls_le_dir }}/live/{{ wordpress_domain }}/fullchain.pem"
  register: wordpress_le_existing

# Presence is not the same as usability. The teardown deliberately keeps
# the certificate lineage when Let's Encrypt is switched off, so a cert
# can sit here long past its notAfter. Marking that "ready" would point
# nginx at it and reload - serving an expired certificate to browsers
# before the issuance tasks below ever get a chance to replace it.
- name: Read the existing certificate to check its validity
  community.crypto.x509_certificate_info:
    path: "{{ wordpress_tls_le_dir }}/live/{{ wordpress_domain }}/fullchain.pem"
  register: wordpress_le_existing_info
  when: wordpress_le_existing.stat.exists

- name: Record whether the Let's Encrypt certificate is usable
  ansible.builtin.set_fact:
    wordpress_tls_le_ready: >-
      {{ wordpress_le_existing.stat.exists
         and not (wordpress_le_existing_info.expired | default(true)) }}

# An expired certificate is no better than a missing one for binding :443,
# so it needs the bootstrap pair minted just the same.
- name: Record whether a bootstrap certificate must be minted
  ansible.builtin.set_fact:
    wordpress_tls_bootstrap_needed: >-
      {{ wordpress_tls_self_signed
         or (wordpress_tls_letsencrypt and not wordpress_tls_le_ready | bool) }}

# --- TLS ----------------------------------------------------------------
# A self-signed certificate is generated once and then reused: the
# certificate task is skipped while the file is still valid, so re-runs
# stay idempotent instead of minting a new cert (and a new browser
# warning) every time.
#
# The bootstrap pair is minted even with wordpress_tls_self_signed off
# whenever Let's Encrypt is on and has not issued yet: nginx is started
# before certbot and cannot bind :443 without a certificate, so skipping
# it here would crash-loop nginx and leave the ACME challenge unanswered.

- name: Generate the TLS private key
  community.crypto.openssl_privatekey:
    path: "{{ wordpress_tls_key_path }}"
    size: 2048
    owner: root
    group: root
    mode: '0600'
  when: wordpress_tls_bootstrap_needed | bool
  notify: Reload nginx

- name: Generate the certificate signing request
  community.crypto.openssl_csr:
    path: "{{ wordpress_stack_dir }}/certs/site.csr"
    privatekey_path: "{{ wordpress_tls_key_path }}"
    common_name: "{{ wordpress_domain }}"
    country_name: "{{ wordpress_tls_country }}"
    organization_name: "{{ wordpress_tls_org }}"
    subject_alt_name: "{{ ['DNS:' + wordpress_domain, 'DNS:www.' + wordpress_domain, 'DNS:' + wordpress_pma_domain] }}"
    owner: root
    group: root
    mode: '0644'
  when: wordpress_tls_bootstrap_needed | bool

- name: Generate the self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ wordpress_tls_cert_path }}"
    privatekey_path: "{{ wordpress_tls_key_path }}"
    csr_path: "{{ wordpress_stack_dir }}/certs/site.csr"
    provider: selfsigned
    selfsigned_not_after: "+365d"
    owner: root
    group: root
    mode: '0644'
  when: wordpress_tls_bootstrap_needed | bool
  notify: Reload nginx

# --- Stack configuration ------------------------------------------------

- name: Render the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ wordpress_stack_dir }}/.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Recreate the stack

- name: Render the Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ wordpress_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'
  notify: Recreate the stack

- name: Render the nginx site configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ wordpress_stack_dir }}/nginx/conf.d/default.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

# --- Bring the stack up -------------------------------------------------

# A web server installed straight on the host holds :80 and :443, and
# Compose then fails with "address already in use". The containerised
# nginx is the only thing that should own those ports here.
- name: Collect service facts
  ansible.builtin.service_facts:

- name: Stop and disable host web servers
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ wordpress_conflicting_services }}"
  when: item + '.service' in ansible_facts.services

- name: Start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ wordpress_stack_dir }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 300
  when: not ansible_check_mode

# Config changes must land before WordPress is installed against them.
- name: Apply pending configuration changes
  ansible.builtin.meta: flush_handlers

# --- Trusted TLS --------------------------------------------------------
# Deliberately after the stack is up: the ACME HTTP-01 challenge is
# answered by the nginx we just started.
- name: Obtain and maintain a Let's Encrypt certificate
  ansible.builtin.include_tasks: letsencrypt.yml
  when:
    - wordpress_tls_letsencrypt
    - not ansible_check_mode

- name: Remove the renewal machinery when Let's Encrypt is turned off
  ansible.builtin.include_tasks: letsencrypt-teardown.yml
  when: not wordpress_tls_letsencrypt

# --- First-run WordPress installation -----------------------------------

- name: Check whether WordPress is already installed
  ansible.builtin.command:
    cmd: docker compose --profile tools run --rm -T wpcli wp core is-installed
    chdir: "{{ wordpress_stack_dir }}"
  register: wordpress_installed
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Install WordPress
  ansible.builtin.command:
    cmd: >-
      docker compose --profile tools run --rm -T wpcli wp core install
      --url={{ wordpress_site_url }}
      --title={{ wordpress_site_title | quote }}
      --admin_user={{ wordpress_admin_user | quote }}
      --admin_password={{ vault_wp_admin_password | quote }}
      --admin_email={{ wordpress_admin_email | quote }}
      --skip-email
    chdir: "{{ wordpress_stack_dir }}"
  register: wordpress_install
  changed_when: wordpress_install.rc == 0
  no_log: true
  when:
    - not ansible_check_mode
    - wordpress_installed.rc | default(1) != 0

# `wp core install` writes the URL it was given at the time into the
# database, so a site first installed against the bare IP keeps claiming
# to live there after a domain is configured. The WP_HOME / WP_SITEURL
# constants in wp-config.php do override it at runtime, which is why the
# site works either way - but plugins and stored content read the options
# directly, so leaving them stale is a slow-burning inconsistency.
# Converging them here means changing wordpress_domain is enough.
- name: Align the stored site URL with the configured domain
  ansible.builtin.command:
    cmd: >-
      docker compose --profile tools run --rm -T wpcli
      wp option update {{ item }} {{ wordpress_site_url | quote }}
    chdir: "{{ wordpress_stack_dir }}"
  loop:
    - home
    - siteurl
  register: wordpress_url_sync
  # wp-cli says "Updated" only when the value actually moved; an unchanged
  # value reports "unchanged", which must not count as a change.
  changed_when: "'Updated' in wordpress_url_sync.stdout"
  when: not ansible_check_mode

---
# Config changes only reach the containers when Compose re-reads them, so
# any template change converges the stack rather than waiting for a
# manual `docker compose up`.
- name: Recreate the stack
  community.docker.docker_compose_v2:
    project_src: "{{ wordpress_stack_dir }}"
    state: present
  when: not ansible_check_mode

- name: Reload nginx
  community.docker.docker_container_exec:
    container: "{{ wordpress_project_name }}-nginx-1"
    command: nginx -s reload
  when: not ansible_check_mode

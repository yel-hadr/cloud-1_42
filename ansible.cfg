[defaults]
inventory = ./inventory.yaml

# EC2 Ubuntu AMIs log in as 'ubuntu'; root login is disabled by default.
# Anything needing root uses `become: true` in the playbooks.
remote_user = ubuntu

private_key_file = ./server_key.pem

host_key_checking = False

# Don't warn about the discovered Python interpreter on the target.
interpreter_python = auto_silent

# Readable multi-line output - matters when reading `setup` facts
# and `--diff` output later in the week. The old `stdout_callback = yaml`
# was removed in community.general 12; this is the replacement.
callback_result_format = yaml

# Read the vault passphrase from a file instead of prompting on every run.
# .vault_pass is gitignored - it must never be committed.
vault_password_file = ./.vault_pass

[ssh_connection]
# Reuse one SSH connection across tasks; much faster playbook runs.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
